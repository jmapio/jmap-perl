# Docker Compose template for the JMAP proxy.
#
#   cp .env.example .env      # fill in at least BASEURL and JMAP_SECRET_KEY
#   docker compose up -d --build
#
# Then open http://localhost:8080 for the management dashboard.
# All settings live in .env; SETUP.md describes every variable.

services:
  jmap-proxy:
    # Builds this checkout. To run a published image instead, replace
    # build: with image: ghcr.io/jmapio/jmap-proxy:<tag>.
    build: .
    image: jmap-proxy:local
    container_name: jmap-proxy
    restart: unless-stopped
    env_file: .env
    environment:
      # The management server binds 127.0.0.1 by default, which inside the
      # container means the port mapping below cannot reach it. The mapping
      # itself keeps it on the host's loopback interface.
      JMAP_MGMT_HOST: 0.0.0.0
    ports:
      # JMAP endpoint, plain HTTP: put a TLS reverse proxy in front of it
      # (SETUP.md, "TLS Termination") and set BASEURL to its public URL.  It
      # is published on the host's loopback only, for a reverse proxy on the
      # host; set JMAP_PUBLISH_PORT=9000 to publish it on every interface.
      - "${JMAP_PUBLISH_PORT:-127.0.0.1:9000}:9000"
      # Management API and dashboard. Every request needs the management
      # token (JMAP_MGMT_TOKEN, or the one generated into /data/mgmt-token);
      # it stays on 127.0.0.1 all the same: use an SSH tunnel from elsewhere.
      - "127.0.0.1:${JMAP_MGMT_PUBLISH_PORT:-8080}:8080"
    volumes:
      # SQLite databases: accounts.sqlite3 plus one file per account.
      - jmap-data:/data
    # If the reverse proxy runs in a container (Caddy, Traefik, cloudflared),
    # join its network and point it at http://jmap-proxy:9000 instead of
    # publishing port 9000.
    # Note: on a shared network every container can also reach the
    # management port 8080 (account creation, credentials, deletion); only
    # the management token stands in the way. Join a network you trust.
    # networks:
    #   - proxy

volumes:
  jmap-data:

